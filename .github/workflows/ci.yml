name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: mkdir -p .release/package && npm pack --ignore-scripts --pack-destination .release/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package
          path: .release/package/*.tgz
          if-no-files-found: error
  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: .release/package
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run docs:check
      - run: npm run smoke -- --archive-dir .release/package
      - if: matrix.node == 24
        run: npm run test:operational
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run check:core
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run docs:build
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:e2e
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run catalog:audit
      - run: npm run release -- record-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.node }}
          path: .release/evidence/*.json
          if-no-files-found: warn
